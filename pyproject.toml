[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "melotts"
version = "0.1.2"
description = "High-quality multi-lingual text-to-speech with ONNX Runtime inference"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "txtsplit",
  "torch",
  "torchaudio",
  "onnx>=1.16.0",
  "onnxruntime==1.20.1",
  "transformers==4.27.4",
  "num2words==0.5.12",
  "unidic_lite==1.0.8",
  "unidic==1.1.0",
  "mecab-python3==1.0.9",
  "pykakasi==2.2.1",
  "fugashi==1.3.0",
  "g2p_en==2.1.0",
  "anyascii==0.3.2",
  "jamo==0.4.1",
  "gruut[de,es,fr]==2.2.3",
  "g2pkk>=0.1.1",
  "librosa==0.9.1",
  "pyloudnorm",
  "pydub==0.25.1",
  "eng_to_ipa==0.0.2",
  "inflect==7.0.0",
  "unidecode==1.3.7",
  "pypinyin==0.50.0",
  "cn2an==0.5.22",
  "jieba==0.42.1",
  "gradio",
  "langid==1.1.6",
  "tqdm",
  "tensorboard==2.16.2",
  "loguru==0.7.2",
  "botocore>=1.34.98",
  "cached_path>=1.6.2",
  "onnxscript>=0.6.2",
]

[project.scripts]
melotts = "melo.main:main"
melo = "melo.main:main"
melo-ui = "melo.app:main"
melo-openai-speech = "melo.openai_speech_server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["melo*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "cmudict_*"]
